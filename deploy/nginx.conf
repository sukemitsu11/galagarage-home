server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 8m;

  # Реальный адрес клиента. 172.28.0.1 это хост Docker: так приходят запросы от внешнего прокси
  # (Caddy, nginx на хосте) при BIND_ADDR=127.0.0.1. Для Cloudflare или другого прокси
  # добавьте его адреса и поменяйте real_ip_header на CF-Connecting-IP.
  set_real_ip_from 172.28.0.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # The backend sets its own security headers; nginx only forwards the real client address.
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
  }

  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
