# Путь страницы без параметров. Он вставляется в index.html (SSI) и уходит в backend за заголовками для поисковиков.
map $request_uri $seo_path {
  default /;
  "~^(?<path>[^?]*)" $path;
}

# Не больше 10 загрузок страниц в секунду с одного адреса (всплеск до 30): каждая страница делает запросы в базу.
limit_req_zone $binary_remote_addr zone=pages:10m rate=10r/s;

# Схема, под которой сайт открыт снаружи (за туннелем или внешним прокси nginx видит http).
map $http_x_forwarded_proto $seo_scheme {
  default $scheme;
  https https;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 8m;

  # Сжатие текста: скрипты и стили сайта, ответы API, шрифт.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml font/ttf application/xml text/xml text/plain;

  # Реальный адрес клиента. 172.28.0.1 это хост Docker: так приходят запросы от внешнего прокси
  # (Caddy, nginx на хосте) при BIND_ADDR=127.0.0.1. Для Cloudflare или другого прокси
  # добавьте его адреса и поменяйте real_ip_header на CF-Connecting-IP.
  set_real_ip_from 172.28.0.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # The backend sets its own security headers; nginx only forwards the real client address.
  # Служебная проверка страниц: её вызывает только nginx через /_route, снаружи она не нужна.
  location = /api/route {
    return 404;
  }

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
  }

  # Карта сайта и robots.txt строит backend: ему известны товары и разделы.
  location = /sitemap.xml {
    proxy_pass http://backend:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $seo_scheme;
  }

  location = /robots.txt {
    proxy_pass http://backend:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $seo_scheme;
  }

  # Внутренний запрос из index.html: название, описание, canonical, превью для мессенджеров, schema.org.
  location /_seo/ {
    internal;
    proxy_pass http://backend:8080/api/seo/;
    # Cookie и чужие заголовки клиента backend не нужны: уходят только Host и схема.
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $seo_scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
  }

  # Файлы сборки Vite с хешем в имени (index-D03BP6Ka.js): содержимое под этим именем не меняется.
  location ~ "^/assets/.+-[A-Za-z0-9_-]{8}\.(js|css)$" {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
  }

  location ^~ /admin {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    ssi on;
    ssi_silent_errors on;
    try_files /index.html =404;
  }

  # Спрашивает backend, есть ли такая страница (раздел, товар). Ответ 204 пропускает дальше, 403 значит 404.
  location = /_route {
    internal;
    proxy_pass http://backend:8080/api/route;
    proxy_pass_request_body off;
    proxy_pass_request_headers off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Seo-Path $seo_path;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    ssi on;
    ssi_silent_errors on;
    try_files $uri @spa;
  }

  # Адреса без файла отдают index.html (React сам рисует страницу). Неизвестный адрес получает статус 404.
  location @spa {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    limit_req zone=pages burst=30 nodelay;
    ssi on;
    ssi_silent_errors on;
    auth_request /_route;
    error_page 403 =404 @notfound;
    # Если backend не отвечает, страница всё равно открывается: лучше 200, чем сломанный сайт.
    error_page 500 502 504 =200 @spa_open;
    rewrite ^ /index.html break;
  }

  location @notfound {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    ssi on;
    ssi_silent_errors on;
    rewrite ^ /index.html break;
  }

  location @spa_open {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    ssi on;
    ssi_silent_errors on;
    rewrite ^ /index.html break;
  }
}
